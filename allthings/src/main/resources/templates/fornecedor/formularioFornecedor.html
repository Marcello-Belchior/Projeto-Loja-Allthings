<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulário de Fornecedores</title>
</head>
<body>
    <h1 style="text-align: center;">Cadastro de Fornecedores</h1>
    <form th:action="@{/clientes/salvar}" method="post" th:object="${fornecedor}">
        

        <input type="hidden" name="idFornecedor" th:field="*{idFornecedor}">

        <label for="nomeFornecedor">Nome:</label>
        <input 
            type="text"
            id="nomeFornecedor"
            name="nomeFornecedor"
            th:field="*{nomeFornecedor}">
        <br /><br />
        <label for="enderecoFornecedor">Endereço:</label>
        <input 
            type="text"
            id="enderecoFornecedor"
            name="enderecoFornecedor"
            th:field="*{enderecoFornecedor}">
        <br /><br />
        <label for="cidadeFornecedor">Cidade:</label>
        <input 
            type="text"
            id="cidadeFornecedor"
            name="cidadeFornecedor"
            th:field="*{cidadeFornecedor}">
        <br /><br />
        <label for="estadoFornecedor">Estado:</label>
        <input 
            type="text"
            id="estadoFornecedor"
            name="estadoFornecedor"
            th:field="*{estadoFornecedor}">
        <br /><br />
        <label for="cepFornecedor">CEP:</label>
        <input 
            type="text"
            id="cepFornecedor"
            name="cepFornecedor"
            th:field="*{cepFornecedor}">
        <br /><br />
        <label for="cnpjFornecedor">CNPJ:</label>
        <input 
            type="text"
            id="cnpjFornecedor"
            name="cnpjFornecedor"
            th:field="*{cnpjFornecedor}">
        <br /><br />
        <button type="submit">Salvar Fornecedor</button>
        
    </form>
</body>
</html>
