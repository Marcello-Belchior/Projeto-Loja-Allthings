<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="text-align: center;">Lista</h1>
    <h3 style="text-align: center;">
        <a href="/clientes/criar">Novo Cliente</a>
    </h3>

    <!--Tabela para exibir os clientes cadastrados-->
    <table align="center" border="1">
        <tr>
            <td colspan="7" style="text-align: center;">Lista de Clientes</td>
        </tr>
        <tr>
            <th>Nome</th>
            <th>Endereço</th>
            <th>Cidade</th>
            <th>Estado</th>
            <th>CEP</th>
            <th>CPF</th>
            <th>RG</th>
            <th colspan="2">Ações</th>
        </tr>
        <tr th:each="cliente : ${clientes}">
            <td th:text="${cliente.nomeCliente}"></td>
            <td th:text="${cliente.enderecoCliente}"></td>
            <td th:text="${cliente.cidadeCliente}"></td>
            <td th:text="${cliente.estadoCliente}"></td>
            <td th:text="${cliente.cepCliente}"></td>
            <td th:text="${cliente.cpfCliente}"></td>
            <td th:text="${cliente.rgCliente}"></td>
            
            <td>
                <a th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}">
                    Editar
                </a>
        
                <a th:href="@{/clientes/excluir/{id}(id=${cliente.idCliente})}">
                    Excluir
                </a>
            </td>
        </tr>
    </table>
    <btn><a href="/allthings">Voltar</a></btn>
</body>
</html>
