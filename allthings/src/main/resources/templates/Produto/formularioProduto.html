<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomulário de Produtos</title>
</head>
<body>
    <h1 style="text-align: center;">Cadastro de Produtos</h1>
    <form th:action="@{/produtos/salvar}" method="post" th:object="${produto}">
        

        <input type="hidden" name="idProduto" th:field="*{idProduto}">

        <label for="descProduto">Descrição:</label>
        <input 
            type="text"
            id="descProduto"
            name="descProduto"
            th:field="*{descProduto}">
        <br /><br />
        <label for="unidadeProduto">Unidade:</label>
        <input 
            type="text"
            id="unidadeProduto"
            name="unidadeProduto"
            th:field="*{unidadeProduto}">
        <br /><br />
        <label for="marcaProduto">Marca:</label>
        <input 
            type="text"
            id="marcaProduto"
            name="marcaProduto"
            th:field="*{marcaProduto}">
        <br /><br />
        <label for="modeloProduto">Modelo:</label>
        <input 
            type="text"
            id="modeloProduto"
            name="modeloProduto"
            th:field="*{modeloProduto}">
        <br /><br />
        <label for="valorProduto">Valor:</label>
        <input 
            type="text"
            id="valorProduto"
            name="valorProduto"
            th:field="*{valorProduto}">
        <br /><br />
        <label for="idFornecedor">Fornecedor:</label>
        <select th:field="*{fornecedor}">
        <option value="" disabled selected>Selecione o fornecedor</option>
        <option th:each="fornecedor : ${fornecedores}"
                th:text="${fornecedor.nomeFornecedor}"
                th:value="${fornecedor.idFornecedor}"></option>
        </select>
        <label for="idCategoria">Categoria:</label>
        <select th:field="*{categoria}">
        <option value="" disabled selected>Selecione a Categoria</option>
        <option th:each="categoria : ${categorias}"
                th:text="${categoria.nomeCategoria}"
                th:value="${categoria.idCategoria}"></option>
        </select>
        <br /><br />
        <button type="submit">Salvar Produto</button>
        
    </form>
</body>
</html>
