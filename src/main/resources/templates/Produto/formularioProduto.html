<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Produtos</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar(activePage='produtos')}"></div>

        <main class="content">
            <div class="page-header">
                <div>
                    <h1>Cadastro de Produtos</h1>
                    <p class="page-subtitle">Preencha os dados do produto</p>
                </div>
            </div>

            <div class="card form-card">
                <div class="card-body">
                    <form th:action="@{/produtos/salvar}" method="post" th:object="${produto}">

                        <input type="hidden" name="idProduto" th:field="*{idProduto}">

                        <div class="form-group">
                            <label for="descProduto">Descrição</label>
                            <input type="text" id="descProduto" name="descProduto" th:field="*{descProduto}">
                        </div>

                        <div class="form-group">
                            <label for="unidadeProduto">Unidade</label>
                            <input type="text" id="unidadeProduto" name="unidadeProduto" th:field="*{unidadeProduto}">
                        </div>

                        <div class="form-group">
                            <label for="marcaProduto">Marca</label>
                            <input type="text" id="marcaProduto" name="marcaProduto" th:field="*{marcaProduto}">
                        </div>

                        <div class="form-group">
                            <label for="modeloProduto">Modelo</label>
                            <input type="text" id="modeloProduto" name="modeloProduto" th:field="*{modeloProduto}">
                        </div>

                        <div class="form-group">
                            <label for="valorProduto">Valor</label>
                            <input type="text" id="valorProduto" name="valorProduto" th:field="*{valorProduto}">
                        </div>

                        <div class="form-group">
                            <label for="fornecedor">Fornecedor</label>
                            <select id="fornecedor" th:field="*{fornecedor}">
                                <option value="" disabled selected>Selecione o fornecedor</option>
                                <option th:each="fornecedor : ${fornecedores}"
                                        th:text="${fornecedor.nomeFornecedor}"
                                        th:value="${fornecedor.idFornecedor}"></option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="categoria">Categoria</label>
                            <select id="categoria" th:field="*{categoria}">
                                <option value="" disabled selected>Selecione a categoria</option>
                                <option th:each="categoria : ${categorias}"
                                        th:text="${categoria.nomeCategoria}"
                                        th:value="${categoria.idCategoria}"></option>
                            </select>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Salvar Produto</button>
                            <a class="btn btn-outline" href="/produtos/listar">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
